name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (movement physics + parkour course)
        run: npm test
      - name: Build the game
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: blockfire-client
          path: client/dist
